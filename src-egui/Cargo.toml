[package]
name = "claudia-egui"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", features = ["persistence"] }
egui_extras = { version = "0.29", features = ["image"] }
egui_plot = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
petgraph = "0.6"  # For workflow graphs
# rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }  # File dialogs
dashmap = "6.1"  # Thread-safe hashmaps
crossbeam-channel = "0.5"  # Multi-producer multi-consumer channels
once_cell = "1.20"  # Lazy statics
parking_lot = "0.12"  # Better mutexes
reqwest = { version = "0.12", features = ["json"] }  # HTTP client for IPC
bincode = "1.3"  # Binary serialization
strum = { version = "0.26", features = ["derive"] }  # Enum utilities
rusqlite = { version = "0.32", features = ["bundled"] }  # Database access
dirs = "5.0"  # System directory paths

# Platform-specific dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"